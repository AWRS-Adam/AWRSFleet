<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWRS Fleet — Inspection</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f3;--surface:#fff;--border:#e0deda;--border-med:#c8c5bf;
  --text:#1a1a18;--text-sec:#6b6965;--text-hint:#9e9b97;
  --blue:#185FA5;--blue-dark:#0C447C;--blue-light:#E6F1FB;--blue-mid:#B5D4F4;
  --red:#A32D2D;--red-light:#FCEBEB;--red-mid:#F09595;
  --green:#3B6D11;--green-light:#EAF3DE;--green-mid:#97C459;
  --amber:#854F0B;--amber-light:#FAEEDA;--amber-mid:#FAC775;
  --radius:10px;--radius-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.topbar img{height:36px;width:auto}
.topbar-info{flex:1}
.topbar-title{font-size:16px;font-weight:600}
.topbar-sub{font-size:12px;color:var(--text-sec)}
.content{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1px solid var(--border-med);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;transition:background .12s;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:var(--blue-dark)}
.btn.full{width:100%;justify-content:center}
.form-row{margin-bottom:12px}
label.fl{font-size:13px;color:var(--text-sec);display:block;margin-bottom:4px;font-weight:500}
input[type=text],input[type=number],textarea{width:100%;padding:9px 12px;border:1px solid var(--border-med);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.sec-head{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-hint);padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.insp-item{padding:10px 0;border-bottom:1px solid var(--border)}
.insp-item:last-child{border-bottom:none}
.insp-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.insp-label{font-size:14px;flex:1;padding-top:2px}
.radio-group{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.radio-group label{display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);white-space:nowrap}
.radio-group input[type=radio]{display:none}
.radio-group label:has(input[value=ok]:checked){border-color:var(--green-mid);background:var(--green-light)}
.radio-group label:has(input[value=defect]:checked){border-color:var(--red-mid);background:var(--red-light)}
.defect-note{width:100%;margin-top:6px;padding:6px 10px;border:1px solid var(--red-mid);border-radius:var(--radius-sm);background:var(--red-light);color:var(--text);font-size:13px;font-family:inherit;display:none}
.photo-row{margin-top:8px;display:none;align-items:center;gap:8px;flex-wrap:wrap}
.photo-row.visible{display:flex}
.photo-thumb{width:60px;height:60px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border)}
.photo-add-btn{width:60px;height:60px;border:2px dashed var(--border-med);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;color:var(--text-hint);background:var(--bg);flex-shrink:0}
.photo-add-btn:hover{border-color:var(--blue);color:var(--blue)}
.alert-box{padding:14px 16px;border-radius:var(--radius);margin-bottom:12px;font-size:14px}
.alert-box.danger{background:var(--red-light);border:1px solid var(--red-mid);color:var(--red)}
.alert-box.success{background:var(--green-light);border:1px solid var(--green-mid);color:var(--green)}
.gps-badge{font-size:11px;padding:2px 7px;background:var(--green-light);border:1px solid var(--green-mid);border-radius:20px;color:var(--green);display:inline-flex;align-items:center;gap:3px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-page{text-align:center;padding:60px 20px}
.error-page h2{font-size:20px;margin-bottom:8px}
.screen{display:none}.screen.active{display:block}
</style>
</head>
<body>

<!-- NOT FOUND -->
<div id="screen-notfound" class="screen">
  <div class="error-page">
    <div style="font-size:48px;margin-bottom:16px">🔍</div>
    <h2>Unit Not Found</h2>
    <p style="color:var(--text-sec)">This QR code doesn't match any unit in the fleet.<br>Please contact your manager.</p>
  </div>
</div>

let currentUnit = null;
let gpsData = null;
let inspectionPhotos = {};
let inspectionId = 'INS-' + Date.now();

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function typeName(t) {
  return t === 'van' ? 'Van/Pickup' : t === 'trailer' ? 'Trailer' : 'Box Truck (10k+)';
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener('load', function() {
  const params = new URLSearchParams(window.location.search);
  const unitId = params.get('unit');

  if (!unitId) { showScreen('screen-notfound'); return; }

  const unit = PRELOADED_FLEET.find(u => u.id === unitId);
  if (!unit) { showScreen('screen-notfound'); return; }

  currentUnit = unit;
  document.getElementById('insp-title').textContent = 'Unit ' + unit.id;
  document.getElementById('insp-sub').textContent = typeName(unit.type) + (unit.make ? ' · ' + unit.make + ' ' + (unit.year || '') : '') + (unit.location ? ' · ' + unit.location : '');
  document.getElementById('insp-date').value = new Date().toLocaleString();

  buildForm(unit);
  showScreen('screen-inspect');

  document.getElementById('gps-btn').onclick = captureGPS;
  document.getElementById('submit-btn').onclick = submitInspection;
});

// ─── BUILD FORM ───────────────────────────────────────────────────────────────
function buildForm(unit) {
  const secs = ITEMS[unit.type];
  let html = '';
  for (const [sec, items] of Object.entries(secs)) {
    html += `<div class="card"><p class="sec-head">${sec}</p>`;
    items.forEach((item, idx) => {
      const key = 's' + sec.replace(/\W/g, '') + idx;
      html += `<div class="insp-item">
        <div class="insp-item-top">
          <span class="insp-label">${item}</span>
          <div class="radio-group">
            <label><input type="radio" name="${key}" value="ok"><span style="color:var(--green)">OK</span></label>
            <label><input type="radio" name="${key}" value="defect"><span style="color:var(--red)">Defect</span></label>
            <label><input type="radio" name="${key}" value="na"><span>N/A</span></label>
          </div>
        </div>
        <input class="defect-note" type="text" placeholder="Describe defect…" id="note-${key}">
        <div class="photo-row" id="photo-row-${key}">
          <div class="photo-add-btn" id="photo-btn-${key}">📷</div>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  document.getElementById('insp-sections').innerHTML = html;

  // Bind radio changes
  document.querySelectorAll('#insp-sections input[type=radio]').forEach(r => {
    r.addEventListener('change', function() {
      const note = document.getElementById('note-' + this.name);
      const pr = document.getElementById('photo-row-' + this.name);
      note.style.display = this.value === 'defect' ? 'block' : 'none';
      if (this.value !== 'defect') note.value = '';
      if (pr) pr.classList.toggle('visible', this.value === 'defect');
    });
  });

  // Bind photo buttons
  document.querySelectorAll('.photo-add-btn').forEach(btn => {
    const key = btn.id.replace('photo-btn-', '');
    btn.onclick = () => triggerPhoto(key);
  });
}

// ─── PHOTOS ───────────────────────────────────────────────────────────────────
async function triggerPhoto(key) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    const btn = document.getElementById('photo-btn-' + key);
    if (btn) { btn.textContent = '⏳'; btn.style.pointerEvents = 'none'; }
    try {
      const ext = file.name.split('.').pop() || 'jpg';
      const path = `inspections/${inspectionId}/${key}-${Date.now()}.${ext}`;
      const { error } = await sb.storage.from('Fleet-Photos').upload(path, file, { contentType: file.type });
      if (error) throw error;
      const { data: urlData } = sb.storage.from('Fleet-Photos').getPublicUrl(path);
      if (!inspectionPhotos[key]) inspectionPhotos[key] = [];
      inspectionPhotos[key].push({ url: urlData.publicUrl, path });
      renderPhotoRow(key);
    } catch(e) { alert('Photo upload failed: ' + e.message); }
    if (btn) { btn.textContent = '📷'; btn.style.pointerEvents = ''; }
  };
  input.click();
}

function renderPhotoRow(key) {
  const row = document.getElementById('photo-row-' + key); if (!row) return;
  const photos = inspectionPhotos[key] || [];
  row.innerHTML = photos.map(p => `<img class="photo-thumb" src="${p.url}" style="${p.pending?'opacity:.6':''}" title="${p.pending?'Will upload on submit':''}">`).join('') +
    `<div class="photo-add-btn" id="photo-btn-${key}">📷</div>`;
  row.classList.add('visible');
  document.getElementById('photo-btn-' + key).onclick = () => triggerPhoto(key);
}

// ─── GPS ──────────────────────────────────────────────────────────────────────
function captureGPS() {
  const btn = document.getElementById('gps-btn');
  const status = document.getElementById('gps-status');
  const result = document.getElementById('gps-result');
  if (!navigator.geolocation) { status.textContent = '— not supported'; return; }
  btn.textContent = 'Getting…'; btn.disabled = true;
  navigator.geolocation.getCurrentPosition(pos => {
    gpsData = { lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6), acc: Math.round(pos.coords.accuracy) };
    status.textContent = '— captured';
    result.style.display = 'block';
    result.innerHTML = `<span class="gps-badge">📍 ${gpsData.lat}, ${gpsData.lng} (±${gpsData.acc}m)</span> <a href="https://maps.google.com/?q=${gpsData.lat},${gpsData.lng}" target="_blank" style="font-size:11px;color:var(--blue);margin-left:4px">View map</a>`;
    btn.textContent = '📍 Update Location'; btn.disabled = false;
  }, err => {
    status.textContent = '— error'; btn.textContent = '📍 Capture Location'; btn.disabled = false;
    result.style.display = 'block'; result.textContent = 'Error: ' + err.message;
  }, { enableHighAccuracy: true, timeout: 10000 });
}

// ─── SUBMIT ───────────────────────────────────────────────────────────────────
async function submitInspection() {
  const tech = document.getElementById('tech-name').value.trim();
  if (!tech) { alert('Please enter your name before submitting.'); document.getElementById('tech-name').focus(); return; }

  const secs = ITEMS[currentUnit.type];
  let defects = [], unchecked = [];
  for (const [sec, items] of Object.entries(secs)) {
    items.forEach((item, idx) => {
      const key = 's' + sec.replace(/\W/g, '') + idx;
      const checked = document.querySelector(`input[name="${key}"]:checked`);
      if (!checked) unchecked.push(item);
      else if (checked.value === 'defect') defects.push({ section: sec, item, note: document.getElementById('note-' + key).value, photos: inspectionPhotos[key] || [] });
    });
  }
  if (unchecked.length > 0 && !confirm(`${unchecked.length} item(s) not checked. Submit anyway?`)) return;

  const btn = document.getElementById('submit-btn');
  btn.innerHTML = '<span class="spinner"></span> Submitting…'; btn.disabled = true;

  const odoVal = parseInt(document.getElementById('insp-odo').value) || 0;
  const record = {
    id: inspectionId,
    unitId: currentUnit.id,
    unitType: currentUnit.type,
    unitLocation: currentUnit.location,
    tech,
    odo: odoVal,
    notes: document.getElementById('insp-notes').value,
    ts: Date.now(),
    defects,
    items: allItems,
    gps: gpsData || null,
    submittedBy: 'field-scan'
  };

  try {
    // Set a 10 second timeout on submission
    const submitTimeout = new Promise((_,reject) => setTimeout(() => reject(new Error('timeout')), 10000));
    
    const doSubmit = async () => {
      const { error: inspErr } = await sb.from('fi_inspections').upsert({ id: record.id, data: record }, { onConflict: 'id' });
      if (inspErr) throw inspErr;
      if (defects.length) {
        const defectRows = defects.map((d, di) => ({
          log_id: record.id + '-' + di,
          data: {
            logId: record.id + '-' + di,
            inspectionId: record.id,
            unitId: record.unitId,
            unitLocation: record.unitLocation || '',
            unitType: record.unitType,
            tech: record.tech,
            ts: record.ts,
            section: d.section,
            item: d.item,
            note: d.note || '',
            photos: d.photos || [],
            resolved: false,
            resolvedBy: '',
            resolvedTs: null,
            resolvedNote: ''
          }
        }));
        const { error: defErr } = await sb.from('fi_defect_log').upsert(defectRows, { onConflict: 'log_id' });
        if (defErr) throw defErr;
      }
      if (odoVal > 0) {
        await sb.from('fi_odometer').upsert({ unit_id: currentUnit.id, data: { miles: odoVal, ts: Date.now(), source: 'inspection' } }, { onConflict: 'unit_id' });
      }
    };

    await Promise.race([doSubmit(), submitTimeout]);
    showSummary(record);
    // Upload any pending photos in background after summary shown
    uploadPendingPhotos(record.id);
  } catch(e) {
    // If timeout, still show summary - data may have saved
    if (e.message === 'timeout') {
      showSummary(record);
    } else {
      btn.innerHTML = 'Submit Inspection'; btn.disabled = false;
      alert('Submission failed: ' + e.message + '\n\nPlease try again or contact your manager.');
    }
  }
}

// ─── BACKGROUND PHOTO UPLOAD ─────────────────────────────────────────────────
async function uploadPendingPhotos(recId) {
  for (const [key, photos] of Object.entries(inspectionPhotos)) {
    for (const photo of photos) {
      if (!photo.pending || !photo.file) continue;
      try {
        const ext = photo.file.name.split('.').pop() || 'jpg';
        const path = `inspections/${recId}/${key}-${Date.now()}.${ext}`;
        const uploadUrl = `${SUPABASE_URL}/storage/v1/object/Fleet-Photos/${path}`;
        const res = await fetch(uploadUrl, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${SUPABASE_KEY}`, 'apikey': SUPABASE_KEY, 'Content-Type': photo.file.type, 'x-upsert': 'true' },
          body: photo.file
        });
        if (res.ok) {
          photo.url = `${SUPABASE_URL}/storage/v1/object/public/Fleet-Photos/${path}`;
          photo.path = path;
          photo.pending = false;
        }
      } catch(e) { console.warn('Background photo upload failed:', e); }
    }
  }
  // Update the inspection record with photo URLs
  try {
    const { data } = await sb.from('fi_inspections').select('data').eq('id', recId).single();
    if (data) {
      const rec = data.data;
      rec.defects.forEach(d => {
        const key = 's' + d.section.replace(/\W/g,'') + '0';
        // photos already in record from inspectionPhotos at submit time
      });
    }
  } catch(e) {}
}

// ─── SUMMARY ──────────────────────────────────────────────────────────────────
function showSummary(rec) {
  document.getElementById('summary-unit').textContent = rec.unitId + (rec.unitLocation ? ' · ' + rec.unitLocation : '');
  const alertDiv = document.getElementById('summary-alert');
  if (rec.defects.length) {
    alertDiv.innerHTML = `<div class="alert-box danger"><strong>⚠ ${rec.defects.length} defect${rec.defects.length > 1 ? 's' : ''} flagged on ${rec.unitId}.</strong> Your manager has been notified.</div>`;
  } else {
    alertDiv.innerHTML = `<div class="alert-box success"><strong>✓ All clear — ${rec.unitId} passed inspection.</strong></div>`;
  }
  let defHtml = '';
  if (rec.defects.length) {
    defHtml = `<p class="sec-head" style="margin-bottom:8px">Defects (${rec.defects.length})</p>`;
    rec.defects.forEach(d => {
      defHtml += `<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:14px"><strong>${d.item}</strong><span style="color:var(--text-sec);font-size:13px"> — ${d.section}${d.note ? ' · ' + d.note : ''}</span></div>`;
    });
  }
  const gpsHtml = rec.gps ? `<div style="margin-top:8px"><span class="gps-badge">📍 ${rec.gps.lat}, ${rec.gps.lng}</span></div>` : '';
  document.getElementById('summary-content').innerHTML = `
    <div class="grid2" style="margin-bottom:12px">
      <div><div style="font-size:12px;color:var(--text-sec)">Unit</div><div style="font-weight:600">${rec.unitId}</div></div>
      <div><div style="font-size:12px;color:var(--text-sec)">Submitted by</div><div style="font-weight:600">${rec.tech}</div></div>
      <div><div style="font-size:12px;color:var(--text-sec)">Date</div><div>${new Date(rec.ts).toLocaleString()}</div></div>
      ${rec.odo ? `<div><div style="font-size:12px;color:var(--text-sec)">Odometer</div><div>${parseInt(rec.odo).toLocaleString()} mi</div></div>` : ''}
    </div>
    ${defHtml}
    ${gpsHtml}
    ${rec.notes ? `<p class="sec-head" style="margin-top:12px;margin-bottom:4px">Notes</p><p style="font-size:14px">${rec.notes}</p>` : ''}
  `;
  showScreen('screen-summary');
}
</script>
